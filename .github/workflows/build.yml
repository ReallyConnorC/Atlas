name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack project + Vosk model
        run: |
          unzip -q -o Atlas.zip -d src
          cd src/Atlas
          curl -sL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets/model
          cp -r vosk-model-small-en-us-0.15/* app/src/main/assets/model/

      - name: Build
        working-directory: src/Atlas
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-apk
          path: src/Atlas/app/build/outputs/apk/debug/*.apk
